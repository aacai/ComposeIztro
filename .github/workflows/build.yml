name: Build Packages

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android APK"
        type: boolean
        default: true
      build_desktop:
        description: "Build Desktop (Windows / Linux / macOS)"
        type: boolean
        default: true
      build_web:
        description: "Build Web (WasmJS)"
        type: boolean
        default: true
      build_ios:
        description: "Build iOS (simulator .app; real IPA needs Apple paid dev account + Secrets)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ----------------------------------------------------------------
  # Android：release APK
  # ----------------------------------------------------------------
  android:
    if: github.event_name == 'push' || inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Android signing keystore (from Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/androidApp/release-key.jks"
            echo "Keystore restored."
          else
            echo "No KEYSTORE_BASE64 secret; building with debug signing."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/androidApp/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # ----------------------------------------------------------------
  # Desktop：deb / msi+exe / dmg
  # ----------------------------------------------------------------
  desktop:
    if: github.event_name == 'push' || inputs.build_desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            task: packageDeb
          - os: windows-latest
            arch: x64
            task: packageMsi packageExe
          - os: macos-latest
            arch: arm64
            task: packageDmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build desktop package
        run: ./gradlew :desktopApp:${{ matrix.task }} --stacktrace

      - name: Add arch suffix to package filenames
        shell: bash
        run: |
          cd desktopApp/build/compose/binaries/main
          for ext in deb msi exe dmg; do
            find . -type f -name "*.$ext" | while read -r f; do
              mv "$f" "${f%.$ext}-${{ matrix.arch }}.$ext"
            done
          done

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            desktopApp/build/compose/binaries/main/**/*.deb
            desktopApp/build/compose/binaries/main/**/*.msi
            desktopApp/build/compose/binaries/main/**/*.exe
            desktopApp/build/compose/binaries/main/**/*.dmg
          if-no-files-found: error

  # ----------------------------------------------------------------
  # Desktop ARM64：Linux arm64（预览 runner）
  # ----------------------------------------------------------------
  desktop-arm:
    if: github.event_name == 'push' || inputs.build_desktop
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux packaging deps
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build desktop package
        run: ./gradlew :desktopApp:packageDeb --stacktrace

      - name: Add arch suffix to package filenames
        shell: bash
        run: |
          cd desktopApp/build/compose/binaries/main
          for ext in deb; do
            find . -type f -name "*.$ext" | while read -r f; do
              mv "$f" "${f%.$ext}-arm64.$ext"
            done
          done

      - name: Upload Desktop ARM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ubuntu-24.04-arm-arm64
          path: desktopApp/build/compose/binaries/main/**/*.deb
          if-no-files-found: error

  # ----------------------------------------------------------------
  # Web：WasmJS 产物
  # ----------------------------------------------------------------
  web:
    if: github.event_name == 'push' || inputs.build_web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Web (WasmJS)
        run: ./gradlew :webApp:wasmJsBrowserDistribution --stacktrace

      - name: Package Web artifacts
        run: |
          cd webApp/build/dist/wasmJs/productionExecutable
          zip -r "$GITHUB_WORKSPACE/web.zip" .

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: web.zip
          if-no-files-found: error

  # ----------------------------------------------------------------
  # iOS：默认 simulator .app；配置 Secrets 后可出真机 IPA
  # 需要的 Secrets：
  #   IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD,
  #   IOS_PROVISION_PROFILE_BASE64, IOS_TEAM_ID,
  #   IOS_SIGNING_IDENTITY, IOS_PROFILE_NAME
  # ----------------------------------------------------------------
  ios:
    if: github.event_name == 'push' || inputs.build_ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Import signing (optional)
        env:
          IOS_P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_P12" ]; then
            echo "No signing certificate configured; skipping import (simulator only)."
            exit 0
          fi
          echo "$IOS_P12" | base64 -D -o cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security unlock-keychain -p "" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISION" | base64 -D -o "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

      - name: Build iOS
        env:
          IOS_P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          cd iosApp
          if [ -n "$IOS_P12" ]; then
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              echo '<plist version="1.0">'
              echo '<dict>'
              echo '  <key>signingStyle</key>'
              echo '  <string>manual</string>'
              echo '  <key>method</key>'
              echo '  <string>ad-hoc</string>'
              echo '  <key>teamID</key>'
              echo "  <string>$IOS_TEAM_ID</string>"
              echo '  <key>provisioningProfiles</key>'
              echo '  <dict>'
              echo '    <key>zhiqiu.iztro.ComposeIztro</key>'
              echo "    <string>$IOS_PROFILE_NAME</string>"
              echo '  </dict>'
              echo '</dict>'
              echo '</plist>'
            } > ExportOptions.plist
            xcodebuild -project iosApp.xcodeproj -scheme iosApp \
              -configuration Release archive \
              -archivePath build/iosApp.xcarchive \
              -allowProvisioningUpdates \
              CODE_SIGN_STYLE=manual DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
              CODE_SIGN_IDENTITY="$IOS_SIGNING_IDENTITY"
            xcodebuild -exportArchive -archivePath build/iosApp.xcarchive \
              -exportPath build/ipa -exportOptionsPlist ExportOptions.plist
          else
            xcodebuild -project iosApp.xcodeproj -scheme iosApp \
              -configuration Release -sdk iphonesimulator \
              -derivedDataPath build
            APP=$(find build -name "*.app" -type d | head -n1)
            ditto -c -k --sequesterRsrc --keepParent "$APP" ../ios-simulator.zip
          fi

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            iosApp/build/ipa/*.ipa
            ios-simulator.zip
          if-no-files-found: ignore

  # ----------------------------------------------------------------
  # Release：推送 tag 时汇总产物发布 GitHub Release
  # ----------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, desktop, desktop-arm, web, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes || true

      - name: Generate release notes
        run: |
          {
            echo "# ComposeIztro ${GITHUB_REF_NAME}"
            echo
            echo "| 文件 | 说明 |"
            echo "|------|------|"
            find artifacts -type f | sort | while read -r f; do
              NAME=$(basename "$f")
              case "$NAME" in
                *.apk) echo "| \`$NAME\` | Android APK (arm64-v8a，可直接安装) |" ;;
                *-arm64.dmg|*-x64.dmg|*.dmg) echo "| \`$NAME\` | macOS 安装包 |" ;;
                *-arm64.msi|*-x64.msi|*.msi) echo "| \`$NAME\` | Windows MSI 安装包 |" ;;
                *-arm64.exe|*-x64.exe|*.exe) echo "| \`$NAME\` | Windows EXE 安装包 |" ;;
                *.deb) echo "| \`$NAME\` | Linux deb 安装包 (dpkg -i 安装) |" ;;
                web.zip) echo "| \`$NAME\` | Web 端 (WasmJS)，解压后静态托管即可 |" ;;
                ios-simulator.zip) echo "| \`$NAME\` | iOS 模拟器版 (非真机) |" ;;
                *.ipa) echo "| \`$NAME\` | iOS 真机安装包 (需侧载) |" ;;
                *) echo "| \`$NAME\` | 其他产物 |" ;;
              esac
            done
            echo
            echo "> iOS 真机 IPA 需 Apple 付费开发者账号并配置仓库 Secrets 后才会产出。"
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: release_notes.md
